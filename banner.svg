<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Johan Scheepers - Power Platform Solution Architect Expert">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06090F"/>
      <stop offset="45%" stop-color="#0C1524"/>
      <stop offset="100%" stop-color="#101A2E"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0E75B6"/>
      <stop offset="50%" stop-color="#00C2A8"/>
      <stop offset="100%" stop-color="#7B2FF7"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD874"/>
      <stop offset="50%" stop-color="#FFB900"/>
      <stop offset="100%" stop-color="#E09600"/>
    </linearGradient>
    <linearGradient id="nameFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#DCEEF5"/>
      <stop offset="100%" stop-color="#8FE3D6"/>
    </linearGradient>
    <radialGradient id="glowTeal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00C2A8" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#00C2A8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7B2FF7" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#7B2FF7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#2A3B55" stroke-width="0.6" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <ellipse cx="200" cy="80" rx="380" ry="240" fill="url(#glowTeal)"/>
  <ellipse cx="1030" cy="270" rx="360" ry="230" fill="url(#glowPurple)"/>

  <!-- left accent rail -->
  <rect x="0" y="0" width="7" height="320" fill="url(#accent)"/>

  <!-- circuit flourish, right side -->
  <g stroke="#00C2A8" stroke-opacity="0.35" fill="none" stroke-width="1.4">
    <path d="M980 60 H1090 V110 H1150"/>
    <path d="M1000 150 H1060 V210 H1160"/>
    <path d="M950 250 H1030 V285"/>
  </g>
  <g fill="#00C2A8" fill-opacity="0.75">
    <circle cx="1150" cy="110" r="3.5"/>
    <circle cx="1160" cy="210" r="3.5"/>
    <circle cx="1030" cy="285" r="3.5"/>
    <circle cx="980" cy="60" r="3.5"/>
  </g>

  <!-- name -->
  <text x="64" y="118" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="62" font-weight="700" fill="url(#nameFill)" letter-spacing="1.5">Johan Scheepers</text>

  <!-- rule -->
  <rect x="66" y="140" width="150" height="3" rx="1.5" fill="url(#accent)"/>

  <!-- role -->
  <text x="64" y="180" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="600" fill="#C9D9E8" letter-spacing="0.6">Technical Consultant &#183; Dynamics 365 F&amp;O &#183; Azure &#183; Power Platform</text>

  <!-- expert pill -->
  <g>
    <rect x="64" y="204" width="492" height="34" rx="17" fill="#1A1A1A" stroke="url(#gold)" stroke-width="1.6"/>
    <circle cx="86" cy="221" r="9" fill="url(#gold)"/>
    <path d="M86 215.5l1.9 3.9 4.3.6-3.1 3 .7 4.2-3.8-2-3.8 2 .7-4.2-3.1-3 4.3-.6z" fill="#1A1A1A"/>
    <text x="104" y="227" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#FFD874" letter-spacing="0.8">MICROSOFT CERTIFIED: SOLUTION ARCHITECT EXPERT</text>
  </g>

  <!-- location -->
  <g transform="translate(64,262)">
    <path d="M8 0c4.4 0 8 3.6 8 8 0 5.8-8 14-8 14S0 13.8 0 8c0-4.4 3.6-8 8-8z" fill="#00C2A8" fill-opacity="0.85"/>
    <circle cx="8" cy="8" r="3.2" fill="#0C1524"/>
    <text x="28" y="17" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="16" fill="#8FA8C0" letter-spacing="0.5">Brackenfell, Western Cape, South Africa</text>
  </g>

  <!-- bottom gradient edge -->
  <rect x="0" y="316" width="1200" height="4" fill="url(#accent)"/>
</svg>
