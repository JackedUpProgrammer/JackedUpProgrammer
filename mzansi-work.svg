<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Mzansi Work - Overlooked people. Overlooked opportunities.">
  <defs>
    <linearGradient id="mbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07100C"/>
      <stop offset="55%" stop-color="#0B1A20"/>
      <stop offset="100%" stop-color="#101A2E"/>
    </linearGradient>
    <linearGradient id="sa" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#007A4D"/>
      <stop offset="33%" stop-color="#FFB612"/>
      <stop offset="66%" stop-color="#00C2A8"/>
      <stop offset="100%" stop-color="#7B2FF7"/>
    </linearGradient>
    <linearGradient id="mtitle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#7FE6D6"/>
    </linearGradient>
    <radialGradient id="mglow" cx="18%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#00C2A8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00C2A8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mglow2" cx="85%" cy="85%" r="60%">
      <stop offset="0%" stop-color="#FFB612" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#FFB612" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="300" rx="12" fill="url(#mbg)"/>
  <rect width="1000" height="300" rx="12" fill="url(#mglow)"/>
  <rect width="1000" height="300" rx="12" fill="url(#mglow2)"/>
  <rect x="0" y="0" width="1000" height="5" rx="2.5" fill="url(#sa)"/>

  <!-- dotted people motif: many faded, a few highlighted -->
  <g opacity="0.22" fill="#8FA8C0">
    <circle cx="700" cy="70" r="7"/><circle cx="730" cy="70" r="7"/><circle cx="760" cy="70" r="7"/>
    <circle cx="790" cy="70" r="7"/><circle cx="820" cy="70" r="7"/><circle cx="850" cy="70" r="7"/>
    <circle cx="880" cy="70" r="7"/><circle cx="910" cy="70" r="7"/>
    <circle cx="700" cy="105" r="7"/><circle cx="730" cy="105" r="7"/>
    <circle cx="790" cy="105" r="7"/><circle cx="820" cy="105" r="7"/><circle cx="850" cy="105" r="7"/>
    <circle cx="910" cy="105" r="7"/>
    <circle cx="700" cy="140" r="7"/><circle cx="760" cy="140" r="7"/><circle cx="790" cy="140" r="7"/>
    <circle cx="850" cy="140" r="7"/><circle cx="880" cy="140" r="7"/><circle cx="910" cy="140" r="7"/>
    <circle cx="730" cy="175" r="7"/><circle cx="760" cy="175" r="7"/><circle cx="820" cy="175" r="7"/>
    <circle cx="880" cy="175" r="7"/><circle cx="910" cy="175" r="7"/>
    <circle cx="700" cy="210" r="7"/><circle cx="730" cy="210" r="7"/><circle cx="790" cy="210" r="7"/>
    <circle cx="850" cy="210" r="7"/><circle cx="910" cy="210" r="7"/>
  </g>
  <g fill="#00C2A8">
    <circle cx="760" cy="105" r="8.5"/>
    <circle cx="880" cy="105" r="8.5"/>
    <circle cx="730" cy="140" r="8.5"/>
    <circle cx="820" cy="140" r="8.5"/>
    <circle cx="790" cy="175" r="8.5"/>
    <circle cx="850" cy="175" r="8.5"/>
    <circle cx="760" cy="210" r="8.5"/>
    <circle cx="880" cy="210" r="8.5"/>
  </g>
  <g fill="none" stroke="#FFB612" stroke-width="1.6" opacity="0.8">
    <circle cx="760" cy="105" r="15"/>
    <circle cx="820" cy="140" r="15"/>
    <circle cx="850" cy="175" r="15"/>
  </g>

  <!-- text block -->
  <text x="56" y="76" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#FFB612" letter-spacing="4">SIDE QUEST &#183; SOUTH AFRICA</text>
  <text x="56" y="128" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="46" font-weight="700" fill="url(#mtitle)" letter-spacing="0.5">Mzansi Work</text>
  <rect x="58" y="146" width="120" height="3" rx="1.5" fill="url(#sa)"/>

  <text x="56" y="188" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="600" fill="#FFFFFF" font-style="italic">Overlooked people. Overlooked opportunities.</text>

  <text x="56" y="222" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" fill="#8FA8C0">A low-data job discovery and application-tracking platform for</text>
  <text x="56" y="244" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="14.5" fill="#8FA8C0">entry-level, first-time and overlooked South African job seekers.</text>

  <!-- mini tags -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="600">
    <rect x="56" y="258" width="82" height="22" rx="11" fill="#00C2A8" fill-opacity="0.16" stroke="#00C2A8" stroke-opacity="0.5"/>
    <text x="97" y="273" text-anchor="middle" fill="#7FE6D6">Retail</text>
    <rect x="146" y="258" width="112" height="22" rx="11" fill="#FFB612" fill-opacity="0.14" stroke="#FFB612" stroke-opacity="0.5"/>
    <text x="202" y="273" text-anchor="middle" fill="#FFD874">Learnerships</text>
    <rect x="266" y="258" width="104" height="22" rx="11" fill="#7B2FF7" fill-opacity="0.18" stroke="#7B2FF7" stroke-opacity="0.5"/>
    <text x="318" y="273" text-anchor="middle" fill="#C6A4FF">Government</text>
    <rect x="378" y="258" width="88" height="22" rx="11" fill="#0E75B6" fill-opacity="0.2" stroke="#0E75B6" stroke-opacity="0.6"/>
    <text x="422" y="273" text-anchor="middle" fill="#7EC8F5">Trades</text>
    <rect x="474" y="258" width="92" height="22" rx="11" fill="#00C2A8" fill-opacity="0.16" stroke="#00C2A8" stroke-opacity="0.5"/>
    <text x="520" y="273" text-anchor="middle" fill="#7FE6D6">Logistics</text>
  </g>
</svg>
