<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-label="Microsoft Certifications">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B12"/>
      <stop offset="100%" stop-color="#0F1A2C"/>
    </linearGradient>
    <linearGradient id="cgold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE29A"/>
      <stop offset="50%" stop-color="#FFB900"/>
      <stop offset="100%" stop-color="#D99400"/>
    </linearGradient>
    <linearGradient id="csilver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2F5F8"/>
      <stop offset="50%" stop-color="#C3CCD6"/>
      <stop offset="100%" stop-color="#93A0AE"/>
    </linearGradient>
    <linearGradient id="cblue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3FA9F5"/>
      <stop offset="100%" stop-color="#0E75B6"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B2A42" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#101B2D" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="cglow" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#00C2A8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#00C2A8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="crule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0E75B6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFB900"/>
      <stop offset="100%" stop-color="#7B2FF7" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="470" fill="url(#cbg)"/>
  <rect width="1000" height="470" fill="url(#cglow)"/>

  <!-- heading -->
  <text x="500" y="52" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" letter-spacing="3">MY <tspan fill="#FFB900">MICROSOFT</tspan> CERTIFICATIONS</text>
  <rect x="300" y="66" width="400" height="2" fill="url(#crule)"/>
  <text x="500" y="90" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12.5" fill="#8FA8C0" letter-spacing="5">EXPERTISE &#183; COMMITMENT &#183; IMPACT</text>

  <!-- ===== TOP ROW: Expert + Associate ===== -->
  <!-- Expert card -->
  <g>
    <rect x="130" y="118" width="350" height="140" rx="10" fill="url(#plate)" stroke="#FFB900" stroke-opacity="0.55" stroke-width="1.6"/>
    <rect x="130" y="118" width="350" height="3" rx="1.5" fill="url(#cgold)"/>
    <!-- shield -->
    <g transform="translate(158,146)">
      <path d="M34 0l32 11v22c0 20-13.6 36-32 42-18.4-6-32-22-32-42V11z" fill="url(#cgold)"/>
      <path d="M34 7l25 8.6v17c0 15.6-10.6 28.4-25 33.4-14.4-5-25-17.8-25-33.4v-17z" fill="#12233A"/>
      <text x="34" y="30" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="7" font-weight="700" fill="#FFD874" letter-spacing="0.3">MICROSOFT</text>
      <text x="34" y="43" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">EXPERT</text>
      <g fill="#FFB900">
        <circle cx="22" cy="54" r="3"/><circle cx="34" cy="54" r="3"/><circle cx="46" cy="54" r="3"/>
      </g>
    </g>
    <text x="258" y="163" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#FFB900" letter-spacing="1.4">MICROSOFT CERTIFIED</text>
    <text x="258" y="192" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">Power Platform</text>
    <text x="258" y="216" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">Solution Architect</text>
    <text x="258" y="240" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#8FA8C0" letter-spacing="1.2">PL-600</text>
  </g>

  <!-- Associate card -->
  <g>
    <rect x="520" y="118" width="350" height="140" rx="10" fill="url(#plate)" stroke="#C3CCD6" stroke-opacity="0.5" stroke-width="1.6"/>
    <rect x="520" y="118" width="350" height="3" rx="1.5" fill="url(#csilver)"/>
    <g transform="translate(548,146)">
      <path d="M34 0l32 11v22c0 20-13.6 36-32 42-18.4-6-32-22-32-42V11z" fill="url(#csilver)"/>
      <path d="M34 7l25 8.6v17c0 15.6-10.6 28.4-25 33.4-14.4-5-25-17.8-25-33.4v-17z" fill="#12233A"/>
      <text x="34" y="30" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="7" font-weight="700" fill="#C3CCD6" letter-spacing="0.3">MICROSOFT</text>
      <text x="34" y="43" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8" font-weight="700" fill="#FFFFFF" letter-spacing="0.3">ASSOCIATE</text>
      <g fill="#C3CCD6">
        <circle cx="28" cy="54" r="3"/><circle cx="40" cy="54" r="3"/>
      </g>
    </g>
    <text x="648" y="163" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="11.5" fill="#C3CCD6" letter-spacing="1.4">MICROSOFT CERTIFIED</text>
    <text x="648" y="192" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">Power Platform</text>
    <text x="648" y="216" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="19" font-weight="700" fill="#FFFFFF">Functional Consultant</text>
    <text x="648" y="240" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#8FA8C0" letter-spacing="1.2">PL-200</text>
  </g>

  <!-- ===== BOTTOM ROW: 3 Fundamentals ===== -->
  <g>
    <rect x="70" y="288" width="280" height="140" rx="10" fill="url(#plate)" stroke="#0E75B6" stroke-opacity="0.5" stroke-width="1.4"/>
    <rect x="70" y="288" width="280" height="3" rx="1.5" fill="url(#cblue)"/>
    <g transform="translate(186,306)">
      <path d="M24 0l22 7.6v15c0 13.8-9.4 24.8-22 29-12.6-4.2-22-15.2-22-29v-15z" fill="url(#cblue)"/>
      <path d="M24 6l16 5.5v11.4c0 10.2-6.8 18.4-16 21.8-9.2-3.4-16-11.6-16-21.8V11.5z" fill="#12233A"/>
      <text x="24" y="24" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="5" font-weight="700" fill="#7EC8F5" letter-spacing="0.2">MICROSOFT</text>
      <text x="24" y="34" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="5" font-weight="700" fill="#FFFFFF" letter-spacing="0.1">FUNDAMENTALS</text>
      <circle cx="24" cy="42" r="2.4" fill="#3FA9F5"/>
    </g>
    <text x="210" y="382" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#3FA9F5" letter-spacing="1.2">MICROSOFT CERTIFIED</text>
    <text x="210" y="403" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Dynamics 365</text>
    <text x="210" y="420" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#C9D9E8">Fundamentals (CRM)</text>
  </g>

  <g>
    <rect x="360" y="288" width="280" height="140" rx="10" fill="url(#plate)" stroke="#7B2FF7" stroke-opacity="0.5" stroke-width="1.4"/>
    <rect x="360" y="288" width="280" height="3" rx="1.5" fill="#7B2FF7"/>
    <g transform="translate(476,306)">
      <path d="M24 0l22 7.6v15c0 13.8-9.4 24.8-22 29-12.6-4.2-22-15.2-22-29v-15z" fill="#7B2FF7"/>
      <path d="M24 6l16 5.5v11.4c0 10.2-6.8 18.4-16 21.8-9.2-3.4-16-11.6-16-21.8V11.5z" fill="#12233A"/>
      <text x="24" y="24" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="5" font-weight="700" fill="#C6A4FF" letter-spacing="0.2">MICROSOFT</text>
      <text x="24" y="34" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="5" font-weight="700" fill="#FFFFFF" letter-spacing="0.1">FUNDAMENTALS</text>
      <circle cx="24" cy="42" r="2.4" fill="#C6A4FF"/>
    </g>
    <text x="500" y="382" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#C6A4FF" letter-spacing="1.2">MICROSOFT CERTIFIED</text>
    <text x="500" y="403" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Power Platform</text>
    <text x="500" y="420" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#C9D9E8">Fundamentals</text>
  </g>

  <g>
    <rect x="650" y="288" width="280" height="140" rx="10" fill="url(#plate)" stroke="#00C2A8" stroke-opacity="0.5" stroke-width="1.4"/>
    <rect x="650" y="288" width="280" height="3" rx="1.5" fill="#00C2A8"/>
    <g transform="translate(766,306)">
      <path d="M24 0l22 7.6v15c0 13.8-9.4 24.8-22 29-12.6-4.2-22-15.2-22-29v-15z" fill="#00C2A8"/>
      <path d="M24 6l16 5.5v11.4c0 10.2-6.8 18.4-16 21.8-9.2-3.4-16-11.6-16-21.8V11.5z" fill="#12233A"/>
      <text x="24" y="24" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="5" font-weight="700" fill="#7FE6D6" letter-spacing="0.2">MICROSOFT</text>
      <text x="24" y="34" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="5" font-weight="700" fill="#FFFFFF" letter-spacing="0.1">FUNDAMENTALS</text>
      <circle cx="24" cy="42" r="2.4" fill="#7FE6D6"/>
    </g>
    <text x="790" y="382" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="10" fill="#7FE6D6" letter-spacing="1.2">MICROSOFT CERTIFIED</text>
    <text x="790" y="403" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Dynamics 365</text>
    <text x="790" y="420" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="13" fill="#C9D9E8">Fundamentals (ERP)</text>
  </g>
</svg>
